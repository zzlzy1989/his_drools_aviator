server:
  port: 9006

spring:
  application:
    name: his-drg-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yml
        import-check:
          enabled: false
    service-registry:
      auto-registration:
        enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.1.105}:${MYSQL_PORT:3306}/his_rule_engine?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:testhub123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.his.drg.dto
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

drools:
  kiebase-groups:
    - drg-group
    - dip-group

logging:
  level:
    com.his.drg: debug
