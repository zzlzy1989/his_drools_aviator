name: E2E Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Start required services via docker-compose
      - image: docker:24.0.5
        options: --privileged
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - ./his-rule-engine/docker:/workspace/docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: his-rule-engine-web/pnpm-lock.yaml

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: cd his-rule-engine-web && pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd his-rule-engine-web && pnpm exec playwright install chromium

      - name: Start Docker services
        run: |
          cd /workspace/docker
          docker compose up -d mysql nacos redis
          # Wait for services to be healthy
          sleep 30

      - name: Build backend services
        run: |
          cd his-rule-engine
          mvn package -DskipTests -q
          cd docker
          docker compose build his-gateway his-rule-service his-formula-service his-settlement-service
          docker compose up -d

      - name: Start frontend Nginx
        run: |
          cd his-rule-engine-web
          # Build frontend
          pnpm run build
          # Start frontend in background
          docker run -d --name frontend-test -p 8999:8999 \
            -v $(pwd)/dist:/usr/share/nginx/html:ro \
            -v $(pwd)/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            nginx:alpine

      - name: Wait for services
        run: sleep 10

      - name: Run E2E tests
        run: |
          cd his-rule-engine-web
          pnpm exec playwright test --reporter=list

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: his-rule-engine-web/test-results/

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: his-rule-engine-web/test-results/**/*.png

      - name: Cleanup
        if: always()
        run: |
          docker compose -f /workspace/docker/docker-compose.yml down || true
          docker stop frontend-test || true
          docker rm frontend-test || true