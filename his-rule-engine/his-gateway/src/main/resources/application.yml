server:
  port: 9000

spring:
  application:
    name: his-gateway
  config:
    import: optional:nacos
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.1.105:8848}
      config:
        server-addr: ${NACOS_ADDR:192.168.1.105:8848}
        file-extension: yml
        import-check:
          enabled: false
    service-registry:
      auto-registration:
        enabled: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: his-rule-service
          uri: lb://his-rule-service
          predicates:
            - Path=/api/v1/rules/**,/api/v1/flows/**
          filters:
            - StripPrefix=0
        - id: his-formula-service
          uri: lb://his-formula-service
          predicates:
            - Path=/api/v1/formulas/**
          filters:
            - StripPrefix=0
        - id: his-settlement-service
          uri: lb://his-settlement-service
          predicates:
            - Path=/api/v1/settlements/**
          filters:
            - StripPrefix=0
        - id: his-drug-service
          uri: lb://his-drug-service
          predicates:
            - Path=/api/v1/drugs/**
          filters:
            - StripPrefix=0
        - id: his-quality-service
          uri: lb://his-quality-service
          predicates:
            - Path=/api/v1/quality/**
          filters:
            - StripPrefix=0
        - id: his-drg-service
          uri: lb://his-drg-service
          predicates:
            - Path=/api/v1/drg/**
          filters:
            - StripPrefix=0
        - id: his-rule-service-v2
          uri: lb://his-rule-service
          predicates:
            - Path=/api/v2/flows/**
          filters:
            - StripPrefix=0

logging:
  level:
    com.his.gateway: debug
    org.springframework.cloud.gateway: debug

his:
  jwt:
    enabled: false  # 开发阶段关闭JWT认证，前端无登录页面
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080
      - http://localhost:8999
      - http://127.0.0.1:3000
      - http://127.0.0.1:8080
      - http://127.0.0.1:8999
      - http://192.168.1.105:8999
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: Origin,Content-Type,Accept,X-Tenant-Id,Authorization
    allow-credentials: true
    max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
