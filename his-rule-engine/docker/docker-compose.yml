      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-testhub123}
      - MYSQL_DB=his_rule_engine
      - REDIS_HOST=192.168.1.105
      - REDIS_PORT=63790
      - SERVER_PORT=9001
      - JAVA_OPTS=-Xms256m -Xmx512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs/rule-service:/app/logs
    networks:
      - his-net
    restart: unless-stopped
    entrypoint: ["sh", "-c", "java $JAVA_OPTS -jar rule-service.jar"]

