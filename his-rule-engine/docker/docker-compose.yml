version: '3.8'

services:
  # ===== HIS 网关 (9000) =====
  his-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: his-gateway
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_ADDR=192.168.1.105:8848
      - MYSQL_HOST=192.168.1.105
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-testhub123}
      - MYSQL_DB=his_rule_engine
      - REDIS_HOST=192.168.1.105
      - REDIS_PORT=63790
      - JAVA_OPTS=-Xms256m -Xmx512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs/gateway:/app/logs
    networks:
      - his-net
    restart: unless-stopped
    entrypoint: ["sh", "-c", "java $JAVA_OPTS -jar gateway.jar"]

  # ===== HIS 规则服务 (9001) =====
  his-rule-service:
    build:
      context: ..
