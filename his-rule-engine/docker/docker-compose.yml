# HIS 动态规则中台 - Docker Compose 配置
# 使用前请复制 .env.example 为 .env 并修改配置

x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: docker
  NACOS_ADDR: nacos:8848
  MYSQL_HOST: ${MYSQL_HOST:-192.168.1.105}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testhub123}
  MYSQL_DB: ${MYSQL_DB:-his_rule_engine}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}

x-common-config: &common-config
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - his-net
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: '2.0'
      reservations:
        memory: 512M
        cpus: '1.0'

services:
  # ===== Nacos 3.0 注册中心 + 配置中心 =====
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: his-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      MODE: standalone
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: nacos-auth
      NACOS_AUTH_IDENTITY_VALUE: my-identity-value
      JVM_XMS: 256m
      JVM_XMX: 512m
    networks:
      - his-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/ns/operator/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'

  # ===== Redis 7 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: his-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - his-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== HIS 网关 (9000) =====
  his-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: his-gateway
    container_name: his-gateway
    ports:
      - "9000:9000"
    environment:
      <<: *common-env
      SERVER_PORT: 9000
      HIS_JWT_ENABLED: "false"  # 开发阶段关闭JWT认证
    volumes:
      - ./logs/gateway:/app/logs
    <<: *common-config
    depends_on:
      nacos:
        condition: service_healthy

  # ===== HIS 规则服务 (9001) =====
  his-rule-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: his-rule-service
    container_name: his-rule-service
    ports:
      - "9001:9001"
    environment:
      <<: *common-env
      SERVER_PORT: 9001
    volumes:
      - ./logs/rule-service:/app/logs
    <<: *common-config
    depends_on:
      his-gateway:
        condition: service_started
      redis:
        condition: service_healthy

  # ===== HIS 公式服务 (9002) =====
  his-formula-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: his-formula-service
    container_name: his-formula-service
    ports:
      - "9002:9002"
    environment:
      <<: *common-env
      SERVER_PORT: 9002
    volumes:
      - ./logs/formula-service:/app/logs
    <<: *common-config
    depends_on:
      his-gateway:
        condition: service_started

  # ===== HIS 结算服务 (9003) =====
  his-settlement-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: his-settlement-service
    container_name: his-settlement-service
    ports:
      - "9003:9003"
    environment:
      <<: *common-env
      SERVER_PORT: 9003
    volumes:
      - ./logs/settlement-service:/app/logs
    <<: *common-config
    depends_on:
      his-gateway:
        condition: service_started
      his-rule-service:
        condition: service_started
      his-formula-service:
        condition: service_started

  # ===== HIS 药品服务 (9004) =====
  his-drug-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: his-drug-service
    container_name: his-drug-service
    ports:
      - "9004:9004"
    environment:
      <<: *common-env
      SERVER_PORT: 9004
    volumes:
      - ./logs/drug-service:/app/logs
    <<: *common-config
    depends_on:
      his-gateway:
        condition: service_started
      his-rule-service:
        condition: service_started

  # ===== HIS 质控服务 (9005) =====
  his-quality-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: his-quality-service
    container_name: his-quality-service
    ports:
      - "9005:9005"
    environment:
      <<: *common-env
      SERVER_PORT: 9005
    volumes:
      - ./logs/quality-service:/app/logs
    <<: *common-config
    depends_on:
      his-gateway:
        condition: service_started
      his-rule-service:
        condition: service_started

  # ===== HIS DRG服务 (9006) =====
  his-drg-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: his-drg-service
    container_name: his-drg-service
    ports:
      - "9006:9006"
    environment:
      <<: *common-env
      SERVER_PORT: 9006
    volumes:
      - ./logs/drg-service:/app/logs
    <<: *common-config
    depends_on:
      his-gateway:
        condition: service_started
      his-rule-service:
        condition: service_started
      his-formula-service:
        condition: service_started

  # ===== HIS 监控服务 (9007) =====
  his-monitor-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: his-monitor-service
    container_name: his-monitor-service
    ports:
      - "9007:9007"
    environment:
      <<: *common-env
      SERVER_PORT: 9007
    volumes:
      - ./logs/monitor-service:/app/logs
    <<: *common-config
    depends_on:
      his-gateway:
        condition: service_started

  # ===== HIS 规则市场服务 (9008) =====
  his-market-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: his-market-service
    container_name: his-market-service
    ports:
      - "9008:9008"
    environment:
      <<: *common-env
      SERVER_PORT: 9008
    volumes:
      - ./logs/market-service:/app/logs
    <<: *common-config
    depends_on:
      his-gateway:
        condition: service_started

networks:
  his-net:
    driver: bridge

volumes:
  redis-data: