services:
  # ===== HIS 前端 Nginx 代理 =====
  his-frontend:
    image: nginx:alpine
    container_name: his-frontend
    ports:
      - "8999:8999"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - his-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8999/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  his-net:
    external: true