<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIS 动态规则中台 - 规则流设计器</title>
    <style>
      .app-loading {
        width: 100%;
        height: 100vh;
        display: flex;
        background: #f5f5f7;
      }
      .app-loading__sidebar {
        width: 220px;
        height: 100%;
        background: #1d1d1f;
        flex-shrink: 0;
      }
      .app-loading__main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .app-loading__header {
        height: 44px;
        background: #ffffff;
        border-bottom: 1px solid #e0e0e0;
      }
      .app-loading__content {
        flex: 1;
        padding: 24px;
      }
      .app-loading__skeleton-header {
        margin-bottom: 24px;
      }
      .app-loading__skeleton-line {
        height: 16px;
        background: linear-gradient(90deg, #e8e8ed 25%, #f0f0f5 50%, #e8e8ed 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        border-radius: 5px;
        margin-bottom: 8px;
      }
      .app-loading__skeleton-line--title {
        width: 40%;
        height: 24px;
      }
      .app-loading__skeleton-line--subtitle {
        width: 60%;
        height: 14px;
      }
      .app-loading__skeleton-cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 17px;
        margin-bottom: 24px;
      }
      .app-loading__skeleton-card {
        height: 100px;
        background: linear-gradient(90deg, #e8e8ed 25%, #f0f0f5 50%, #e8e8ed 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        border-radius: 11px;
      }
      .app-loading__skeleton-body {
        height: 200px;
        background: linear-gradient(90deg, #e8e8ed 25%, #f0f0f5 50%, #e8e8ed 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        border-radius: 11px;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loading">
        <div class="app-loading__sidebar"></div>
        <div class="app-loading__main">
          <div class="app-loading__header"></div>
          <div class="app-loading__content">
            <div class="app-loading__skeleton-header">
              <div class="app-loading__skeleton-line app-loading__skeleton-line--title"></div>
              <div class="app-loading__skeleton-line app-loading__skeleton-line--subtitle"></div>
            </div>
            <div class="app-loading__skeleton-cards">
              <div class="app-loading__skeleton-card"></div>
              <div class="app-loading__skeleton-card"></div>
              <div class="app-loading__skeleton-card"></div>
              <div class="app-loading__skeleton-card"></div>
            </div>
            <div class="app-loading__skeleton-body"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
